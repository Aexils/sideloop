# Values par défaut de la chart sideloop. Les values d'environnement (homelab)
# surchargent ce fichier — voir le repo d'infra (pattern multi-sources ArgoCD).

# Image sideloop (api + CronJob refresh). Tag SHA écrit par ArgoCD Image Updater.
image:
  repository: ghcr.io/aexils/sideloop
  tag: latest
  pullPolicy: Always        # tag "latest" → tirer la dernière image à chaque run
                            # (TODO: ArgoCD Image Updater + tags SHA, comme nexus)

# Anisette EN K8S (full-k8s pour métriques/logs uniformes). Le PVC anisette-state
# garde l'adi.pb TRUSTÉ (2FA fait UNE fois contre ce pod → 0 re-2FA ensuite).
# Bootstrap : après 1er déploiement, faire le 2FA contre ce pod (cf. README).
anisetteUrl: "http://anisette:6969/"

anisette:
  enabled: true
  # Nom d'un Secret (adi.pb + device.json) servant de SEMENCE DE SECOURS : posé
  # sur le PVC uniquement s'il n'y a pas déjà d'identité. Vide = pas de seed.
  # ⚠ Ce n'est PAS une sauvegarde vivante : l'identité de référence est celle du
  # PVC, que le serveur re-provisionne. Re-sceller le Secret après un bootstrap.
  identitySecret: ""
  # true = ÉCRASE l'identité du PVC par celle du Secret au prochain démarrage.
  # À réserver à une restauration volontaire : laisser true regèle l'identité à
  # chaque start → péremption ADI → 503 chez Apple (cf. templates/anisette.yaml).
  forceReseed: false
  # true = SUPPRIME l'identité au démarrage → le serveur en provisionne une neuve.
  # Coûte une 2FA SMS pour re-truster la machine. Repasser à false aussitôt après,
  # sinon chaque démarrage repart de zéro (2FA à chaque fois). Cf. README.
  reprovision: false
  image:
    repository: dadoum/anisette-v3-server
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 10m, memory: 128Mi}
    limits: {memory: 256Mi}   # l'image dadoum a besoin de ~170Mo

# Compte Apple dédié. Le mot de passe vient d'un Secret (jamais dans les values).
apple:
  appleId: ""            # ex. levasseur.alexis@uqam.ca
  teamId: ""             # ex. 245M5C8BJT
  deviceUdids: ""        # UDID séparés par des virgules (jusqu'à 3 devices)
  passwordSecret: sideloop-apple   # Secret (clé "password"), scellé via Sealed Secrets

# CronJob de re-signature (marge < 7 jours d'expiration du cert gratuit).
refresh:
  enabled: true
  schedule: "0 18 * * *"    # tous les jours à 18h (device à la maison le soir ; cert réutilisé)
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# Frontend / API (upload d'IPA, gestion des apps gérées).
api:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

persistence:
  storageClassName: ""             # anisette-state : local-path (défaut)
  nfsServer: "10.10.10.1"          # pve sur vmbr0 (exporte déjà /mnt/media)
  # /mnt/media est du NTFS (ntfs-3g/FUSE). nfsd ne sait pas encoder de file
  # handle vers un SOUS-répertoire d'un FUSE : monter /mnt/media/sideloop-*
  # directement donne un ESTALE définitif dès que le disque est remonté (cf.
  # panne du 2026-08-10). On monte donc la RACINE exportée + subPath, comme
  # audiobookshelf. Ne pas remettre le sous-répertoire dans `path`.
  nfsPath: /mnt/media
  # IPAs sources + state.json, sur le DD externe 1To.
  ipas:
    subPath: sideloop-ipas
    size: 20Gi
  # IPAs signées + manifest, sur le DD externe (lues par l'agent pve).
  signed:
    subPath: sideloop-signed
    size: 20Gi

route:
  enabled: true
  hostname: sideloop.example.com
  parentRef:
    name: homelab-gw
    namespace: envoy-gateway-system
